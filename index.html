<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Gallery & Portfolio</title>
    <style>
        :root {
            --bg-colour: #0a0a0a;
            --text-colour: #f4f4f4;
            --accent-colour: #c5a059;
            --card-bg: #1a1a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-colour);
            color: var(--text-colour);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        /* Hero Section */
        .hero {
            height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(10, 10, 10, 0.8), rgba(10, 10, 10, 0.9)), url('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=1200&q=80') center/cover;
            padding: 2rem;
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 600px;
            color: #ccc;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 3rem;
            color: var(--accent-colour);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            aspect-ratio: 3/4;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .gallery-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            padding: 2rem 1rem 1rem;
            text-align: center;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Pricing Cards */
        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
        }

        .price-card {
            background-color: var(--card-bg);
            padding: 3rem 2rem;
            text-align: center;
            border-radius: 4px;
            border-top: 3px solid var(--accent-colour);
        }

        .price-card h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .price-card .price {
            font-size: 2rem;
            color: var(--accent-colour);
            margin-bottom: 1.5rem;
            font-weight: bold;
        }

        .price-card p {
            color: #aaa;
            font-size: 0.95rem;
        }

        /* Contact Form */
        .contact-form {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        input, textarea {
            width: 100%;
            padding: 1rem;
            background-color: var(--card-bg);
            border: 1px solid #333;
            color: var(--text-colour);
            font-family: inherit;
            border-radius: 4px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-colour);
        }

        .btn {
            padding: 1rem 2rem;
            background-color: var(--accent-colour);
            color: #000;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #a38446;
        }

        footer {
            text-align: center;
            padding: 2rem;
            background-color: #050505;
            color: #666;
            font-size: 0.9rem;
        }
